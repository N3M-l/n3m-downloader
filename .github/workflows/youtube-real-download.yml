name: YouTube Real Download Diagnostic

on:
  push:
    branches: [diagnostics/youtube-smoke-20261018]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  youtube-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install matching yt-dlp and EJS
        run: python -m pip install --disable-pip-version-check 'yt-dlp[default]>=2026.8.19'
      - name: Test extractor on GitHub runner (comparison only)
        id: runner
        continue-on-error: true
        run: |
          python -m yt_dlp --no-playlist --skip-download --simulate --js-runtimes node \
            'https://www.youtube.com/watch?v=Zl-HU2U85lI'
      - name: Download actual CC video on GitHub runner and verify media
        id: runner_file
        continue-on-error: true
        run: |
          python -m yt_dlp --no-playlist --js-runtimes node --max-filesize 60M \
            --format 'best[height<=360]/best' \
            --output "$RUNNER_TEMP/n3m-youtube-cc.%(ext)s" \
            'https://www.youtube.com/watch?v=Zl-HU2U85lI'
          python - <<'PY'
          import glob, os, subprocess
          files = [p for p in glob.glob(os.environ['RUNNER_TEMP'] + '/n3m-youtube-cc.*') if not p.endswith('.part')]
          assert len(files) == 1, f'Expected one media file, got {len(files)}'
          filename = files[0]
          size = os.path.getsize(filename)
          with open(filename, 'rb') as f:
              header = f.read(32)
          assert size > 4096 and (b'ftyp' in header or header.startswith(bytes.fromhex('1a45dfa3'))), 'Invalid media output'
          print('GitHub runner file verified:', size, 'bytes')
          subprocess.run(['ffprobe', '-v', 'error', '-show_entries', 'format=duration', '-of', 'default=noprint_wrappers=1', filename], check=True)
          PY
      - name: Test actual file download on Render Oregon staging
        id: remote
        continue-on-error: true
        env:
          N3M_SMOKE_ENGINE: https://n3m-downloader-engine-us.onrender.com
        run: python backend/tests/smoke_remote_youtube.py
      - name: Results
        if: always()
        env:
          EXTRACTOR_RESULT: ${{ steps.runner.outcome }}
          REMOTE_RESULT: ${{ steps.remote.outcome }}
          RUNNER_FILE_RESULT: ${{ steps.runner_file.outcome }}
        run: |
          echo "Standalone extractor: $EXTRACTOR_RESULT"
          echo "GitHub runner file test: $RUNNER_FILE_RESULT"
          echo "Render Oregon actual-file test: $REMOTE_RESULT"
          if [ "$REMOTE_RESULT" != "success" ]; then
            echo "::error::YouTube download is not verified working on staging."
            exit 1
          fi
